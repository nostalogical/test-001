name: Demo build commit

on:
  push:
    branches:
      - 'release/**'
      - 'protected/**'

defaults:
  run:
    working-directory: folder


jobs:
  commit-demo:
    runs-on: ubuntu-latest
    environment: bot-commits
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Write a line to the file
        run: echo "Build run at $(date -u)" >> build-log.txt

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Commit and push
        uses: iarekylew00t/verified-bot-commit@5b4e8852dc472093935b8debcb81459bb79f7986
        with:
          token: ${{ steps.app-token.outputs.token }}
          message: "demo: append build timestamp [skip ci]"
          files: folder/build-log.txt
